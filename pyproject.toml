[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-paper-reviewer"
version = "1.0.0"
description = "An MCP-powered academic paper review assistant using OpenAI tool calling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.50.0",
  "mcp>=1.2.0",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
py-modules = ["client", "server", "main"]
